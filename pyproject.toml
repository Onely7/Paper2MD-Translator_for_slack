[project]
name = "paper2md-translator"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.9.0,<3.11"
dependencies = [
    "accelerate==1.6.0",
    "aiohttp>=3.12.13",
    "albumentations==1.4.0",
    "asyncpg>=0.30.0",
    "fastapi>=0.115.13",
    "gunicorn>=23.0.0",
    "mdformat>=0.7.22",
    "numpy<2.0",
    "openai>=1.88.0",
    "opencv-python==4.11.0.86",
    "pydantic-settings>=2.10.1",
    "pymupdf==1.26",
    "pyngrok>=7.2.11",
    "slack-bolt>=1.23.0",
    "timm==0.5.4",
    "torch==2.1.0",
    "torchvision==0.16.0",
    "transformers==4.47.0",
    "uvicorn>=0.34.3",
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", marker = "sys_platform == 'darwin'" },
  { index = "pytorch-cu121", marker = "sys_platform == 'linux'" },
]
torchvision = [
  { index = "pytorch-cpu", marker = "sys_platform == 'darwin'" },
  { index = "pytorch-cu121", marker = "sys_platform == 'Linux'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[dependency-groups]
dev = [
    "jupyterlab>=4.4.3",
]
