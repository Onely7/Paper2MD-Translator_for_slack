[project]
name = "paper2md-translator"
version = "0.2.0"
description = "Slack bot that translates paper PDFs into Japanese Markdown with a summary (Dolphin-v2 + OpenAI)"
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = [
    "accelerate==1.6.0",
    "aiohttp>=3.12.13",
    "fastapi>=0.115.13",
    "mdformat>=0.7.22",
    "nodejs-wheel>=24.19.0",  # Node.js for prettier (tools/prettier)
    "numpy<2.0",
    "openai>=2.6.0,<3",
    "opencv-python==4.11.0.86",
    "pillow>=10",
    "pymupdf==1.26",
    "pyngrok>=7.2.11",
    "qwen-vl-utils==0.0.14",
    "requests>=2.32.0",
    "slack-bolt>=1.23.0",
    "slack-sdk>=3.33",
    "torch==2.1.2",
    "torchvision==0.16.2",
    "tqdm>=4.66",
    "transformers==4.51.3",
    "uvicorn>=0.34.3",
]

[dependency-groups]
dev = [
    "ruff>=0.14",
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", marker = "sys_platform == 'darwin'" },
  { index = "pytorch-cu121", marker = "sys_platform == 'linux'" },
]
torchvision = [
  { index = "pytorch-cpu", marker = "sys_platform == 'darwin'" },
  { index = "pytorch-cu121", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["Dolphin", "yomiyasu"]  # vendored upstream code

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "UP"]
ignore = ["E501"]  # long prompt strings
