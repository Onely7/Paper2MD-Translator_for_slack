# Slack app manifest for Paper2MD-Translator.
# https://api.slack.com/apps -> "Create New App" -> "From a manifest" -> paste this file.
#
# Socket Mode (default): no public URL is needed.  After creating the app, generate an
# App-Level Token with the `connections:write` scope (Basic Information) and set it as
# SLACK_APP_TOKEN in .env.
#
# HTTP mode (with ngrok): set `socket_mode_enabled: false` and add
#   request_url: https://<your ngrok domain>/slack/events
# under both `event_subscriptions` and `interactivity`.
display_information:
  name: Paper2MD-Translator
  description: Translate a paper PDF / URL into Japanese Markdown with a summary
  background_color: "#1d3557"
features:
  app_home:
    home_tab_enabled: true
    messages_tab_enabled: false
    messages_tab_read_only_enabled: true
  bot_user:
    display_name: Paper2MD-Translator
    always_online: false
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - channels:history
      - channels:read
      - chat:write
      - files:read
      - files:write
      - groups:history
      - groups:read
      - im:history
      - mpim:history
      - mpim:read
settings:
  event_subscriptions:
    bot_events:
      - app_home_opened
      - member_joined_channel
      - message.channels
      - message.groups
      - message.im
      - message.mpim
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
